name: CI

on:
  # Pushes to a working branch do not run anything. A pull request runs the pipeline on open and
  # again on every push to it, so fixes are re-verified without reopening anything.
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A new push to the same branch cancels the run still going for the older commit,
# so a burst of pushes does not queue a matrix build for every one of them
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform runs to completion, so that a failure on one still reports the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and the build dir
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --verbose

      # too_many_arguments is the one lint deliberately left unfixed: silencing it would mean
      # restructuring the producer and consumer signatures for no benefit
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::too_many_arguments

      # The runners start with no persistent app dir, which is exactly the state that
      # used to break the program and that the test suite has to keep covering.
      - name: Test
        run: cargo test --verbose

      - name: Run against the repository itself
        run: cargo run --release -p mezura -- ./mezura-core/src --hide bar
