name: CI

on:
  # Pushes to a working branch do not run anything. A pull request runs the pipeline on open and
  # again on every push to it, so fixes are re-verified without reopening anything.
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A new push to the same branch cancels the run still going for the older commit,
# so a burst of pushes does not queue a matrix build for every one of them
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform runs to completion, so that a failure on one still reports the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Two commits and not one: the '--diff' step below counts a revision against another, and
      # the default shallow clone has no HEAD~1 to name
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The goldens are compared across machines and a checkout that rewrote line endings would
      # fail in ways that look like counting bugs. The check looks for CRLF alone, since a file
      # with no line ending at all has nothing to be LF.
      - name: No file was checked out with CRLF
        shell: bash
        run: |
          if git ls-files --eol | grep -E "w/(crlf|mixed)"; then
            echo "the working copy holds a file with CRLF line endings"; exit 1
          fi

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and the build dir
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --verbose

      # The conformance gate. linejudge holds the cases and mezura's declared rules, and the
      # record under .linejudge says what this build must keep answering, so a parser change that
      # moves an answer regenerates that file in the same commit with 'linejudge record'.
      - name: Install linejudge
        run: cargo install linejudge@0.1.0

      - name: Check against the conformance corpus
        shell: bash
        run: |
          bin=target/release/mezura
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          linejudge check --counter mezura --bin "$bin"

      # too_many_arguments is the one lint deliberately left unfixed: silencing it would mean
      # restructuring the producer and consumer signatures for no benefit
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::too_many_arguments

      # The runners start with no persistent app dir, which is exactly the state that
      # used to break the program and that the test suite has to keep covering.
      - name: Test
        run: cargo test --verbose

      - name: Run against the repository itself
        run: cargo run --release -p mezura -- ./mezura-core/src --hide bar

      # Everything git does happens outside this repository's own tests: a worktree is written to
      # the temporary directory, two of them at once, counted, and taken away again on background
      # threads. All of it was only ever run on Windows before this step existed.
      # Bash on every platform, and not only for the pipes below: a windows step left to its own
      # shell answers with the exit code of its last line alone, so a first line that failed
      # passes unnoticed
      - name: Count a revision, and two of them against each other
        shell: bash
        run: |
          cargo run --release -p mezura -- ./mezura-core/src --diff HEAD~1
          cargo run --release -p mezura -- ./mezura-core/src --diff HEAD~1..HEAD

      # The unit tests parse the document with the same crate that wrote it, which says nothing
      # about what actually leaves the process: one stray line printed to the wrong stream makes
      # it unreadable and every one of those tests still passes. Node reads it because every
      # runner is guaranteed to have one, the actions above being written in it.
      - name: The JSON documents parse as JSON
        shell: bash
        run: |
          parses='JSON.parse(require("fs").readFileSync(0, "utf8"))'
          cargo run --release -q -p mezura -- ./mezura-core/src --output json | node -e "$parses"
          cargo run --release -q -p mezura -- ./mezura-core/src --diff HEAD~1 --output json | node -e "$parses"

      # 'main' returns the exit code and no test can reach it, so the promise that 1 means a run
      # that did not happen is guarded by nothing else
      - name: The exit codes say whether the run happened
        shell: bash
        run: |
          cargo run --release -q -p mezura -- ./mezura-core/src > /dev/null
          for bad in "--not-a-command" "./a-directory-that-is-not-there" "--diff HEAD..HEAD"; do
            if cargo run --release -q -p mezura -- $bad > /dev/null 2>&1; then
              echo "'$bad' exited 0, and it is not a run that happened"; exit 1
            fi
          done

      # The three packages are published separately and 'mezura' depends on 'mezura-core' by path
      # and version at once, which only matters here and at the moment of publishing
      - name: Every package still packages
        run: cargo package --workspace
