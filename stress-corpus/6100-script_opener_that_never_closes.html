<!-- trap: the text of a script tag written inside a paragraph, with no closing tag anywhere after
     it. Nothing marks an opener as a tag rather than the same word written out, so a section that
     never closes is text and the rest of the file belongs to the page -->
<p>a page can write <script> as text</p>
<p>and everything under it is still the page</p>
